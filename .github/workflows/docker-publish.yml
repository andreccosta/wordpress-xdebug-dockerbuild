name: Docker publish

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 4 * * 0'

env:
  IMAGE_NAME: wordpress-xdebug

jobs:
  metadata:
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.create-tag.outputs.tag }}
      tag_exists: ${{ steps.check-tag.outputs.result }}
      wordpress_version: ${{ steps.image-tag.outputs.tag }}
      xdebug_version: ${{ steps.package-version.outputs.version }}

    steps:
      - uses: actions/checkout@v7
      - name: Get Docker Hub WordPress latest version tag
        id: image-tag
        uses: ./.github/actions/get-dockerhub-version-tag
        with:
          org: library
          repo: wordpress
      - name: Get Xdebug PECL package version
        id: package-version
        uses: ./.github/actions/get-pecl-package-version
        with:
          package: xdebug
          stability: stable
      - name: Create tag
        id: create-tag
        run: echo "tag=wp${{ steps.image-tag.outputs.tag }}-xdebug${{ steps.package-version.outputs.version }}" >> "$GITHUB_OUTPUT"
      - name: Check if tag already exists
        id: check-tag
        uses: actions/github-script@v9
        with:
          script: |
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: "tags/${{ steps.create-tag.outputs.tag }}"
              });
              return 1;
            } catch (error) {
              if (error.status !== 404) throw error;
              return 0;
            }

  test:
    runs-on: ubuntu-latest
    needs: metadata
    env:
      WORDPRESS_VERSION: ${{ needs.metadata.outputs.wordpress_version }}
      XDEBUG_VERSION: ${{ needs.metadata.outputs.xdebug_version }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: |
            .github/actions/get-dockerhub-version-tag/go.sum
            .github/actions/get-pecl-package-version/go.sum
      - run: .github/scripts/check.sh

  push:
    environment: production
    needs: [metadata, test]
    if: needs.metadata.outputs.tag_exists == 0
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: |
          docker build \
            --build-arg "WORDPRESS_VERSION=${{ needs.metadata.outputs.wordpress_version }}" \
            --build-arg "XDEBUG_VERSION=${{ needs.metadata.outputs.xdebug_version }}" \
            --tag "$IMAGE_NAME" \
            .
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        env:
          VERSION: ${{ needs.metadata.outputs.tag }}
        run: |
          GH_IMAGE_ID=ghcr.io/${{ github.repository }}/$IMAGE_NAME
          DH_IMAGE_ID=${{ github.repository_owner }}/$IMAGE_NAME

          # Container image names must be lowercase.
          GH_IMAGE_ID=$(echo "$GH_IMAGE_ID" | tr '[:upper:]' '[:lower:]')
          DH_IMAGE_ID=$(echo "$DH_IMAGE_ID" | tr '[:upper:]' '[:lower:]')

          docker tag "$IMAGE_NAME" "$GH_IMAGE_ID:latest"
          docker tag "$IMAGE_NAME" "$GH_IMAGE_ID:$VERSION"
          docker tag "$IMAGE_NAME" "$DH_IMAGE_ID:latest"
          docker tag "$IMAGE_NAME" "$DH_IMAGE_ID:$VERSION"
          docker push --all-tags "$GH_IMAGE_ID"
          docker push --all-tags "$DH_IMAGE_ID"
      - name: Create version tag
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: "refs/tags/${{ needs.metadata.outputs.tag }}",
              sha: context.sha
            });
